[project]
name = "mini-quantflow"
version = "0.1.0"
description = "A small, readable, end-to-end quantitative research lab for learning"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
akshare = ["akshare>=1.14"]
mlp = ["torch>=2.4"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pandas-stubs>=2.2",
    "pre-commit>=4.6.0",
    "pytest>=8.4.2",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.7",
    "torch>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "N",
    "PERF",
    "PIE",
    "RUF",
    "S102",
    "S307",
    "S506",
    "S602",
    "S604",
    "S608",
    "SIM",
    "T10",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "S101"]
"experiments/**/*.py" = ["T201"]
"src/quantlab/models/mlp.py" = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["akshare", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["operator", "unreachable"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "--cov=src",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["quantlab"]
omit = [
    "src/quantlab/data/akshare_source.py",
    "src/quantlab/visualization/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
]
